# SRU Alumni Association - Nginx/Hestia production security snippet
# ปรับ path /php-project/ ให้ตรงกับ URL จริงของระบบก่อนใช้งาน

# ห้ามดาวน์โหลดไฟล์ตั้งค่า/SQL/เอกสารภายใน
location ~* ^/php-project/(?:sql|deploy)/ {
    deny all;
    return 403;
}

location ~* ^/php-project/(?:config\.local(?:\.example)?\.php|README\.md|\.user\.ini)$ {
    deny all;
    return 403;
}

# Uploads ต้องเป็นไฟล์ static เท่านั้น ห้าม execute script
location ~* ^/php-project/uploads/.*\.(?:php|phtml|phar|php[0-9]?|cgi|pl|py|sh|bash)$ {
    deny all;
    return 403;
}

location ^~ /php-project/uploads/ {
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# ป้องกันไฟล์ซ่อน ยกเว้น .well-known
location ~ /\.(?!well-known/) {
    deny all;
    return 404;
}
