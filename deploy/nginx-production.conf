# SRU Alumni Association - Nginx/Hestia production security snippet
# ปรับ path /php-project/ ให้ตรงกับ URL จริงของระบบก่อนใช้งาน

# ห้ามดาวน์โหลดไฟล์ตั้งค่า/SQL/เอกสารภายใน
location ~* ^/(?:deploy/|PRODUCTION_DEPLOY\.md$|\.gitignore$|php-project/sql/) {
    deny all;
    return 403;
}

location ~* ^/php-project/(?:config\.php|config\.local(?:\.example)?\.php|README\.md|\.user\.ini)$ {
    deny all;
    return 403;
}

# Uploads เป็น Private Storage: ห้ามเปิดไฟล์โดยตรงทุกชนิด
# ระบบจะส่งไฟล์ผ่าน secure_file.php หลังตรวจสิทธิ์เท่านั้น
location ^~ /php-project/uploads/ {
    deny all;
    return 403;
}

# ป้องกันไฟล์ซ่อน ยกเว้น .well-known
location ~ /\.(?!well-known/) {
    deny all;
    return 404;
}
